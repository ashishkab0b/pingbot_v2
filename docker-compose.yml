x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:

  redis:
    image: redis:latest
    container_name: "redis_db"
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  flask-backend:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./logs/flask:/app/logs
    env_file:
      - ./flask_app/.env
    environment:
      - FLASK_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  celery-worker:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
      args:
        UID: ${APP_UID}
        GID: ${APP_GID}
    command: celery -A celery_app.celery worker --loglevel=info
    restart: unless-stopped
    volumes:
      - ./logs/celery:/app/logs
    env_file:
      - ./flask_app/.env
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      flask-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app.celery inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  celery-beat:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
      args:
        UID: ${APP_UID}
        GID: ${APP_GID}
    command: celery -A celery_app.celery beat --loglevel=info
    restart: unless-stopped
    volumes:
      - ./logs/celery:/app/logs
    env_file:
      - ./flask_app/.env
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      flask-backend:
        condition: service_healthy
    logging: *default-logging

  telegram-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./logs/bot:/app/logs
    env_file:
      - ./bot/.env
    environment:
      - ENV_TYPE=production
    depends_on:
      flask-backend:
        condition: service_healthy
      nginx:
        condition: service_started
    logging: *default-logging

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot  # For Certbot challenge
    depends_on:
      flask-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate --header='Host: emapingbot.com' https://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  certbot:
    image: certbot/certbot
    profiles:
      - maintenance
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    command: ["renew", "--webroot", "--webroot-path=/var/www/certbot", "--non-interactive"]
    logging: *default-logging


volumes:
  redis_data:
