# renew_before_expiry = 30 days
version = 3.0.1
archive_dir = /etc/letsencrypt/archive/emapingbot.com
cert = /etc/letsencrypt/live/emapingbot.com/cert.pem
privkey = /etc/letsencrypt/live/emapingbot.com/privkey.pem
chain = /etc/letsencrypt/live/emapingbot.com/chain.pem
fullchain = /etc/letsencrypt/live/emapingbot.com/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 7d1161f8289e8cd795548d7a5647fe06
authenticator = webroot
webroot_path = /var/www/certbot,
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
[[webroot_map]]
emapingbot.com = /var/www/certbot
www.emapingbot.com = /var/www/certbot
